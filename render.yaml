services:
  - type: web
    name: craveai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PHASE1_PARQUET_PATH
        value: phase1/artifacts/zomato_clean.parquet
      - key: GROQ_API_KEY
        sync: false
