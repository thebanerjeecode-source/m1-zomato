<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Restaurant Recommendations</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Local CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Crave<span>AI</span></h1>
            <p>Discover the perfect dining experience tailored to your taste.</p>
        </header>

        <main class="main-content">
            <!-- Preferences Form -->
            <section class="form-section">
                <form id="preferences-form" class="preferences-form">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g. Bellandur" required>
                    </div>

                    <div class="form-group">
                        <label for="cuisine">Cuisine</label>
                        <input type="text" id="cuisine" name="cuisine" placeholder="e.g. North Indian, Italian" required>
                    </div>

                    <div class="form-group">
                        <label for="budget">Budget Level</label>
                        <select id="budget" name="budget">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="min_rating">Min Rating</label>
                        <input type="number" id="min_rating" name="min_rating" min="0" max="5" step="0.1" value="0.0">
                    </div>

                    <div class="form-group full-width">
                        <label for="additional_preferences">Additional Preferences</label>
                        <textarea id="additional_preferences" name="additional_preferences" rows="2" placeholder="e.g. rooftop seating, quiet ambiance"></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span class="btn-text">Get Recommendations</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </form>
            </section>

            <!-- Results Section -->
            <section class="results-section">
                <div id="results-meta" class="results-meta hidden">
                    <!-- Warnings / Info populated by JS -->
                </div>
                <div id="recommendations-container" class="recommendations-container">
                    <!-- Recommendation cards injected here -->
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <p>Fill out your preferences to see AI recommendations here.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Local JS -->
    <script src="app.js"></script>
</body>
</html>
